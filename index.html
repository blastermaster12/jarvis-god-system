
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — GOD SYSTEM</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #080510;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

header {
    text-align: center;
    color: #bd70ff;
    letter-spacing: 3px;
}

.panel {
    background: #160c25;
    border: 1px solid #8238c9;
    border-radius: 15px;
    padding: 18px;
    margin: 18px 0;
    box-shadow: 0 0 15px #6720a544;
}

h2 { color: #c68aff; }

.core {
    width: 145px;
    height: 145px;
    border: 3px solid #bd70ff;
    border-radius: 50%;
    margin: 30px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    box-shadow: 0 0 30px #a43cff;
    cursor: pointer;
    animation: glow 2s infinite alternate;
}

.core.active {
    background: #35105a;
    box-shadow: 0 0 55px #bd70ff;
}

@keyframes glow {
    from { box-shadow: 0 0 15px #a43cff; }
    to { box-shadow: 0 0 40px #bd70ff; }
}

button {
    background: #822bd1;
    border: none;
    color: white;
    padding: 13px 20px;
    border-radius: 10px;
    margin: 5px;
    cursor: pointer;
}

button:active { background: #bd70ff; }

.stop-button { background: #a52b50; }

input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #8238c9;
    background: #090511;
    color: white;
    margin-bottom: 8px;
}

.stat {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
}

#status {
    color: #bd70ff;
    font-size: 13px;
}

.tagline {
    text-align: center;
    color: #c68aff;
    font-size: 13px;
}

#response {
    line-height: 1.6;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
<h1>JARVIS — GOD SYSTEM</h1>
<p>PERSONAL AI ASSISTANT</p>
</header>

<p class="tagline">Your Personal AI Friend ❤️</p>

<div class="core" id="orb" onclick="startListening()">
JARVIS
</div>

<p class="tagline">Tap to Start Conversation</p>

<div class="panel">
<h2>PLAYER STATUS</h2>
<div class="stat"><span>PLAYER</span><b>DEBASISH</b></div>
<div class="stat"><span>LEVEL</span><b id="level">1</b></div>
<div class="stat"><span>EXP</span><b id="exp">0 / 100</b></div>
<div class="stat"><span>RANK</span><b id="rank">F</b></div>
</div>

<div class="panel">
<h2>DAILY QUEST</h2>
<p>Complete your daily missions.</p>
<button onclick="completeQuest()">Complete Quest</button>
</div>

<div class="panel">
<h2>AI ASSISTANT</h2>

<p id="response">System online. Awaiting command.</p>
<p id="status">SYSTEM READY</p>

<input
    id="command"
    placeholder="Type your command..."
    onkeydown="if(event.key === 'Enter') sendCommand()"
>

<button onclick="sendCommand()">Send</button>
<button onclick="startListening()">🎤 Start Conversation</button>
<button class="stop-button" onclick="stopListening()">■ STOP</button>
</div>

<script>

let level = 1;
let exp = 0;


// LIVE VOICE SESSION STATE

let recognition = null;
let isListening = false;
let voiceSessionActive = false;
let isProcessing = false;
let isSpeaking = false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


// DAILY QUEST

function completeQuest() {

    exp += 25;

    if (exp >= 100) {
        exp -= 100;
        level++;

        document.getElementById("rank").innerText =
            level >= 10 ? "E" : "F";
    }

    document.getElementById("level").innerText = level;
    document.getElementById("exp").innerText = exp + " / 100";

    document.getElementById("response").innerText =
        "Quest completed! EXP received.";

    speakJarvis("Quest completed, Sir. Experience points received.");
}


// VOICE RECOGNITION SETUP

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    // Hindi speech recognition
    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = function() {

        isListening = true;

        document.getElementById("status").innerText =
            "JARVIS IS LISTENING...";

        document.getElementById("orb").classList.add("active");
    };


    recognition.onresult = function(event) {

        let finalTranscript = "";
        let interimTranscript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {

            const transcript = event.results[i][0].transcript;

            if (event.results[i].isFinal) {
                finalTranscript += transcript;
            } else {
                interimTranscript += transcript;
            }
        }

        const input = document.getElementById("command");

        if (interimTranscript) {
            input.value = interimTranscript;
            document.getElementById("status").innerText =
                "HEARING YOUR VOICE...";
        }

        if (finalTranscript.trim()) {

            input.value = finalTranscript.trim();

            document.getElementById("status").innerText =
                "VOICE RECEIVED";

            sendCommand();
        }
    };


    recognition.onerror = function(event) {

        document.getElementById("status").innerText =
            "VOICE ERROR: " + event.error;

        if (
            event.error === "not-allowed" ||
            event.error === "service-not-allowed" ||
            event.error === "audio-capture"
        ) {
            voiceSessionActive = false;
            document.getElementById("orb").classList.remove("active");
        }
    };


    recognition.onend = function() {

        isListening = false;

        if (!voiceSessionActive) {
            document.getElementById("orb").classList.remove("active");
            return;
        }

        // Restart only when JARVIS is not processing or speaking
        if (!isProcessing && !isSpeaking) {
            startRecognitionAgain();
        }
    };
}


// START / RESTART RECOGNITION

function startRecognitionAgain() {

    if (
        !voiceSessionActive ||
        isListening ||
        isProcessing ||
        isSpeaking ||
        !recognition
    ) return;

    try {
        recognition.start();
    } catch (error) {
        document.getElementById("status").innerText =
            "MICROPHONE RESTARTING...";
    }
}


// START LIVE CONVERSATION

async function startListening() {

    if (!recognition) {
        document.getElementById("status").innerText =
            "VOICE RECOGNITION NOT SUPPORTED";

        document.getElementById("response").innerText =
            "Please open JARVIS in Chrome on HTTPS.";

        return;
    }

    if (voiceSessionActive) return;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById("status").innerText =
            "MICROPHONE NOT AVAILABLE";
        return;
    }

    try {

        document.getElementById("status").innerText =
            "CHECKING MICROPHONE...";

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        stream.getTracks().forEach(track => track.stop());

        voiceSessionActive = true;

        window.speechSynthesis?.cancel();

        document.getElementById("orb").classList.add("active");

        document.getElementById("response").innerText =
            "Hello Sir! I am listening. You can talk to me.";

        document.getElementById("status").innerText =
            "LIVE VOICE SESSION STARTED";

        startRecognitionAgain();

    } catch (error) {

        voiceSessionActive = false;

        document.getElementById("status").innerText =
            "MICROPHONE ERROR: " + error.name;

        document.getElementById("response").innerText =
            "Please allow microphone permission in Chrome.";
    }
}


// STOP LIVE CONVERSATION

function stopListening() {

    voiceSessionActive = false;
    isSpeaking = false;

    window.speechSynthesis?.cancel();

    if (recognition && isListening) {
        recognition.stop();
    }

    isListening = false;

    document.getElementById("orb").classList.remove("active");

    document.getElementById("status").innerText =
        "VOICE SESSION STOPPED";

    document.getElementById("response").innerText =
        "Live conversation ended, Sir.";
}


// AI CHAT CONNECTION

async function sendCommand() {

    const input = document.getElementById("command");
    const responseBox = document.getElementById("response");
    const status = document.getElementById("status");

    const command = input.value.trim();

    if (!command || isProcessing) return;

    // Stop microphone while AI processes
    if (recognition && isListening) {
        recognition.stop();
    }

    window.speechSynthesis?.cancel();

    isProcessing = true;
    isSpeaking = false;

    status.innerText = "JARVIS IS THINKING...";
    responseBox.innerText = "Processing your command, Sir...";

    try {

        const response = await fetch(
            "https://jarvis-god-system.onrender.com/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: command })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "AI connection failed");
        }

        responseBox.innerText = data.reply;
        input.value = "";

        isProcessing = false;

        status.innerText = "JARVIS ONLINE";

        speakJarvis(data.reply);

    } catch (error) {

        isProcessing = false;

        responseBox.innerText =
            "Sorry Sir, AI connection failed: " + error.message;

        status.innerText = "CONNECTION ERROR";

        speakJarvis("Sorry Sir, I am having trouble connecting to my AI brain.");
    }
}


// JARVIS VOICE OUTPUT

function speakJarvis(message) {

    if (!("speechSynthesis" in window)) {

        isSpeaking = false;

        if (voiceSessionActive) {
            startRecognitionAgain();
        }

        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(message);

    speech.lang = "en-IN";
    speech.rate = 0.90;
    speech.pitch = 0.75;
    speech.volume = 1;

    const voices = window.speechSynthesis.getVoices();

    const selectedVoice = voices.find(v =>
        /male|david|mark|daniel|james/i.test(v.name)
    );

    if (selectedVoice) {
        speech.voice = selectedVoice;
    }

    isSpeaking = true;

    speech.onstart = function() {
        document.getElementById("status").innerText =
            "JARVIS IS SPEAKING...";
    };

    speech.onend = function() {

        isSpeaking = false;

        if (voiceSessionActive) {

            document.getElementById("status").innerText =
                "JARVIS IS LISTENING...";

            startRecognitionAgain();

        } else {

            document.getElementById("status").innerText =
                "JARVIS ONLINE";
        }
    };

    speech.onerror = function() {

        isSpeaking = false;

        if (voiceSessionActive) {
            startRecognitionAgain();
        }
    };

    window.speechSynthesis.speak(speech);
}


// JARVIS ACTIVATION

function activate() {

    const message =
        "Hello Sir. JARVIS system is online. How can I assist you?";

    document.getElementById("response").innerText = message;

    document.getElementById("status").innerText =
        "JARVIS ONLINE";

    speakJarvis(message);
}

</script>

</body>
</html>
