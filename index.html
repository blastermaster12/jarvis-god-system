
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — GOD SYSTEM</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080510;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

header {
    text-align: center;
    color: #bd70ff;
    letter-spacing: 3px;
}

.panel {
    background: #160c25;
    border: 1px solid #8238c9;
    border-radius: 15px;
    padding: 18px;
    margin: 18px 0;
    box-shadow: 0 0 15px #6720a544;
}

h2 {
    color: #c68aff;
}

.core {
    width: 145px;
    height: 145px;
    border: 3px solid #bd70ff;
    border-radius: 50%;
    margin: 30px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    box-shadow: 0 0 30px #a43cff;
    cursor: pointer;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 15px #a43cff; }
    to { box-shadow: 0 0 40px #bd70ff; }
}

button {
    background: #822bd1;
    border: none;
    color: white;
    padding: 13px 20px;
    border-radius: 10px;
    margin: 5px;
    cursor: pointer;
}

button:active {
    background: #bd70ff;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #8238c9;
    background: #090511;
    color: white;
    margin-bottom: 8px;
}

.stat {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
}

#status {
    color: #bd70ff;
    font-size: 13px;
}

</style>
</head>

<body>

<header>
<h1>JARVIS — GOD SYSTEM</h1>
<p>PERSONAL AI ASSISTANT</p>
</header>

<div class="core" onclick="activate()">
JARVIS
</div>

<div class="panel">
<h2>PLAYER STATUS</h2>

<div class="stat">
<span>PLAYER</span>
<b>DEBASISH</b>
</div>

<div class="stat">
<span>LEVEL</span>
<b id="level">1</b>
</div>

<div class="stat">
<span>EXP</span>
<b id="exp">0 / 100</b>
</div>

<div class="stat">
<span>RANK</span>
<b id="rank">F</b>
</div>
</div>

<div class="panel">
<h2>DAILY QUEST</h2>
<p>Complete your daily missions.</p>
<button onclick="completeQuest()">Complete Quest</button>
</div>

<div class="panel">
<h2>AI ASSISTANT</h2>

<p id="response">System online. Awaiting command.</p>

<p id="status">SYSTEM READY</p>

<input
    id="command"
    placeholder="Type your command..."
    onkeydown="if(event.key === 'Enter') sendCommand()"
>

<button onclick="sendCommand()">Send</button>

<button onclick="startListening()">🎤 Speak</button>

<button onclick="stopListening()">Stop Mic</button>

</div>

<script>

let level = 1;
let exp = 0;

function completeQuest() {

    exp += 25;

    if (exp >= 100) {
        exp -= 100;
        level++;

        document.getElementById("rank").innerText =
            level >= 10 ? "E" : "F";
    }

    document.getElementById("level").innerText = level;

    document.getElementById("exp").innerText =
        exp + " / 100";

    document.getElementById("response").innerText =
        "Quest completed! EXP received.";

    speakJarvis("Quest completed, Sir. Experience points received.");
}


// AI CHAT CONNECTION

async function sendCommand() {

    const input = document.getElementById("command");
    const responseBox = document.getElementById("response");
    const status = document.getElementById("status");

    const command = input.value.trim();

    if (!command) return;

    window.speechSynthesis?.cancel();

    status.innerText = "JARVIS IS THINKING...";
    responseBox.innerText = "Processing your command, Sir...";

    try {

        const response = await fetch(
            "https://jarvis-god-system.onrender.com/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: command
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "AI connection failed");
        }

        responseBox.innerText = data.reply;

        status.innerText = "JARVIS ONLINE";

        input.value = "";

        speakJarvis(data.reply);

    } catch (error) {

        responseBox.innerText =
            "Sorry Sir, AI connection failed: " + error.message;

        status.innerText = "CONNECTION ERROR";
    }
}


// VOICE INPUT SYSTEM

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {

        isListening = true;

        document.getElementById("status").innerText =
            "🎤 JARVIS IS LISTENING...";

        document.getElementById("response").innerText =
            "Speak now, Sir...";
    };

    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        document.getElementById("command").value =
            transcript;

        document.getElementById("status").innerText =
            "VOICE RECEIVED";

        sendCommand();
    };

    recognition.onerror = function(event) {

        isListening = false;

        document.getElementById("status").innerText =
            "VOICE ERROR: " + event.error;

        if (event.error === "not-allowed") {
            document.getElementById("response").innerText =
                "Microphone permission denied. Please allow microphone access.";
        }
    };

    recognition.onend = function() {

        isListening = false;
    };

}


function startListening() {
    if (!recognition) {
        document.getElementById("response").innerText =
            "Voice recognition is not supported in this browser. Please try Chrome.";
        return;
    }

    if (isListening) {
        return;
    }

    window.speechSynthesis?.cancel();

    try {
        recognition.start();
    } catch (error) {
        document.getElementById("status").innerText =
            "MICROPHONE START ERROR";
    }
}
    }
}


function stopListening() {

    if (recognition && isListening) {

        recognition.stop();

        document.getElementById("status").innerText =
            "MICROPHONE STOPPED";
    }
}


// VOICE OUTPUT SYSTEM

function speakJarvis(message) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(message);

    speech.lang = "en-IN";
    speech.rate = 0.90;
    speech.pitch = 0.75;
    speech.volume = 1;

    const voices = window.speechSynthesis.getVoices();

    const maleVoice = voices.find(v =>
        /male|david|mark|daniel|james/i.test(v.name)
    );

    if (maleVoice) {
        speech.voice = maleVoice;
    }

    window.speechSynthesis.speak(speech);
}
